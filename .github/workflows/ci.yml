name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # No Local.xcconfig on a runner, so this exercises the path a stranger
      # cloning the repository takes: ad-hoc signing, no Apple account.
      - name: Build
        run: xcodebuild -project TypeSwitch.xcodeproj -scheme TypeSwitch -configuration Release build
